<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemeenteniconen</title>
</head>
<body>
    <header>
        <a href="index.html"><img src="logo.png" alt="Gemeenteniconen"></a>
        <button>
            menu
        </button>
    </header>

    <main>
        <section>
            <h1>Iconen</h1>
            <p>ontwikkeld door opengemeenten en gemeente Veenendaal. Bedoeld voor toptaken, formulieren en navigatie op verschillende overheidssituaties. Beschikbaar in 4 varianten zodat het altijd past bij uw ontwerp.</p>
        </section>
        <search>
            <form action="">
                <input type="text" placeholder="zoek een icoon...">

                <input type="radio" name="variant" id="line">
                <label for="line">line</label>

                <input type="radio" name="variant" id="fill">
                <label for="fill">fill</label>
                
                <input type="radio" name="variant" id="regular">
                <label for="regular">regular</label>
                
                <input type="radio" name="variant" id="diapositive">
                <label for="diapositive">diapositive</label>
            </form>
        </search>

        <section>
            <h2>5 iconen</h2>
            <article>
                <img src="/assets/Iconenset-master/Svg/Line/Aanmelden.svg" alt="aanmelden" width="100">
                <p>aanmelden</p>
            </article>
            <article>
                <img src="/assets/Iconenset-master/Svg/Line/Actueel.svg" alt="een krant" width="100">
                <p>actueel</p>
            </article>
            <article>
                <img src="/assets/Iconenset-master/Svg/Line/Afval.svg" alt="afvalcontainer" width="100">
                <p>afval</p>
            </article>
            <article>
                <img src="/assets/Iconenset-master/Svg/Line/AfvalbakAfvalzak.svg" alt="afvalcontainer en een afvalzak" width="100">
                <p>afvalbak afvalzak</p>
            </article>
            <article>
                <img src="/assets/Iconenset-master/Svg/Line/AfvalbakPMD.svg" alt="afvalcontainer met plastic flessen" width="100">
                <p>afvalbak pmd</p>
            </article>
        </section>
    </main>
    
</body>
</html>
